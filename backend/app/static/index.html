<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace2Root Agent</title>
  <style>
    :root{color-scheme:dark;--bg:#08101d;--panel:#111c2e;--panel2:#0b1525;--line:#273b58;--text:#eaf1ff;--muted:#94a8c6;--accent:#39d7b3;--warn:#ffc857;--danger:#ff6b7a}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 16% 0,#173047,var(--bg) 42%);color:var(--text)}main{max-width:1380px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:16px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 8px;color:var(--accent)}small,.muted{color:var(--muted)}.status,.pill{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:#182944}.health-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:16px}.health{background:#0d1829;border:1px solid var(--line);border-radius:10px;padding:10px}.health b{display:block;font-size:12px}.health span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.stack{display:grid;gap:16px}.card{background:rgba(17,28,46,.95);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 14px 50px #0004}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:var(--muted);display:block;margin:11px 0 5px}input,textarea,select,button{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}textarea{min-height:86px;resize:vertical}button{background:var(--accent);color:#04140f;border:0;font-weight:700;cursor:pointer}button.secondary{background:#223651;color:var(--text)}button.danger{background:var(--danger);color:#210408}button.small{width:auto;padding:7px 10px;margin:3px}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.timeline{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.event{border-left:2px solid var(--accent);padding:6px 12px;margin:8px 0;background:#0a142366;border-radius:0 8px 8px 0}.event pre{white-space:pre-wrap;color:var(--muted);font-size:12px;max-height:210px;overflow:auto}.report{line-height:1.62}.report p{margin:7px 0}.empty{display:grid;place-items:center;min-height:380px;color:var(--muted);text-align:center}.source,.row{padding:9px;border:1px solid var(--line);border-radius:8px;margin:7px 0;background:#0b1525}.source{font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row .grow{min-width:0}.row button{width:auto;white-space:nowrap}.scroll{max-height:280px;overflow:auto}code{color:var(--warn)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.badge-good{color:var(--accent)}.badge-warn{color:var(--warn)}@media(max-width:900px){.grid{grid-template-columns:1fr}.health-grid{grid-template-columns:1fr 1fr}main{padding:13px}}
  </style>
</head>
<body><main>
  <header><div><h1>TRACE2ROOT AGENT · 迹因智能体</h1><small>FastAPI · LangGraph · SQLite · Milvus Lite · Ollama · BGE</small></div><span id="health" class="status">检查中</span></header><div id="healthGrid" class="health-grid"></div>
  <div class="grid"><div class="stack">
    <section class="card"><h2>触发故障分析</h2><div class="two"><div><label>服务</label><select id="service"><option>payment-service</option><option>order-service</option><option>user-service</option></select></div><div><label>环境</label><select id="env"><option>production</option><option>staging</option></select></div></div><label>告警</label><input id="alert" value="HighLatency"><label>分析目标</label><textarea id="goal">分析支付服务高延迟告警，检索手册并结合指标和日志给出处置建议</textarea><label><input id="notify" type="checkbox" style="width:auto"> 发送 Mock 通知</label><div class="actions"><button id="run" onclick="start()">开始分析</button><button id="cancel" class="danger" onclick="cancelTask()" disabled>取消任务</button></div></section>
    <section class="card"><h2>快速知识问答</h2><textarea id="question">支付服务高延迟如何排查？</textarea><button onclick="askQuestion()">查询</button><div id="chatbox" class="muted"></div></section>
    <section class="card"><h2>知识库管理</h2><input id="file" type="file" accept=".md,.txt,.pdf"><label>文档类型</label><select id="docType"><option value="alert_runbook">告警 Runbook</option><option value="service_manual">服务手册</option><option value="incident_history">历史事故</option></select><button class="secondary" onclick="uploadDoc()">上传并建立索引</button><div id="uploadMsg" class="muted"></div><div id="documents" class="scroll"></div></section>
  </div><div class="stack">
    <section class="card"><div id="output" class="empty">输入告警后，这里将展示计划、工具调用、动态重规划、证据、结论和处置建议。</div></section>
    <section class="card"><h2>历史任务</h2><div id="tasks" class="scroll muted">加载中…</div></section><section class="card"><h2>评测看板</h2><div id="evaluations" class="muted">加载中…</div></section>
  </div></div>
</main><script>
const api='/api/v1',byId=id=>document.getElementById(id),out=byId('output');let currentTask=null,chatSession=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusCard(name,value,detail){return '<div class="health"><b>'+esc(name)+' · <span class="'+(value?'badge-good':'badge-warn')+'">'+(value?'正常':'降级')+'</span></b><span>'+esc(detail)+'</span></div>'}
async function ready(){const badge=byId('health');try{const r=await fetch(api+'/ready'),j=await r.json(),c=j.checks;badge.textContent=j.status+' · '+c.llm_mode;badge.style.color=j.status==='ready'?'#39d7b3':'#ffc857';byId('healthGrid').innerHTML=statusCard('SQLite',c.sqlite,'任务与记忆持久化')+statusCard('Milvus Lite',c.milvus_lite,c.retrieval.strategy+' / Top-'+c.retrieval.final_top_n)+statusCard('Ollama',c.llm,c.llm_mode)+statusCard('MCP',c.mcp.status==='connected',(c.mcp.tools||[]).join(', '))+statusCard('Embedding',true,c.embedding.model+' / '+c.embedding.device)+statusCard('Reranker',!c.reranker.last_error,c.reranker.model+' / '+c.reranker.device)}catch{badge.textContent='offline'}}
async function start(){const button=byId('run');button.disabled=true;byId('cancel').disabled=false;out.innerHTML='<div class="timeline"><span class="pill">queued</span></div>';const body={trigger_type:'manual',goal:byId('goal').value,alert:{alert_name:byId('alert').value,service_name:byId('service').value,environment:byId('env').value,severity:'warning',labels:{},annotations:{}},notify:byId('notify').checked};try{const r=await fetch(api+'/ai_ops',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.task_id)throw new Error(j.detail?JSON.stringify(j.detail):'后端未返回 task_id');currentTask=j.task_id;poll(j.task_id)}catch(error){showError('提交失败',error);finishButtons()}}
function finishButtons(){byId('run').disabled=false;byId('cancel').disabled=true;loadTasks()}
async function cancelTask(){if(!currentTask)return;await fetch(api+'/ai_ops/'+encodeURIComponent(currentTask)+'/cancel',{method:'POST'});byId('cancel').disabled=true}
function renderReport(report){const rc=report.root_causes||[],rec=report.recommendations||[],evidence=report.evidence||[],unconfirmed=report.unconfirmed||[];return '<div class="report"><h3>执行摘要</h3><p>'+esc(report.executive_summary||'')+'</p><small>分析来源：'+esc(report.analysis_source||'unknown')+' · '+(report.need_human?'需要人工复核':'证据已满足自动结论阈值')+'</small><h3>根因候选与正反证据</h3>'+rc.map(x=>'<div class="source"><b>'+esc(x.candidate)+'</b>（'+esc(x.confidence)+'）<br>'+esc(x.basis)+'<br><span class="badge-good">支持：</span>'+(x.supporting_evidence||[]).map(esc).join('；')+'<br><span class="badge-warn">反对/缺口：</span>'+((x.contradicting_evidence||[]).map(esc).join('；')||'暂无明确反证')+'</div>').join('')+'<h3>工具观察</h3>'+evidence.map(x=>'<div class="source"><b>'+esc(x.tool_name)+'</b> · '+esc(x.result?.summary)+'</div>').join('')+(unconfirmed.length?'<h3>未确认项</h3><ul>'+unconfirmed.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<h3>处置建议（仅建议，未执行）</h3><ol>'+rec.map(x=>'<li>'+esc(x.action||x)+' <code>'+esc(x.risk_level||'')+'</code></li>').join('')+'</ol></div>'}
function approvalHtml(events){const event=[...events].reverse().find(e=>e.type==='approval_required');if(!event)return '';const id=event.payload.approval_id;return '<div class="report"><h3>需要人工审批</h3><p>L3 高风险操作已被审批门拦截，Mock 模式不会真正重启生产服务。</p><button class="small" onclick="approve(\''+esc(id)+'\',true)">批准演示</button><button class="small danger" onclick="approve(\''+esc(id)+'\',false)">拒绝</button></div>'}
async function approve(id,approved){await fetch(api+'/approvals/'+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({approved,reason:'Web 演示审批'})});poll(currentTask)}
async function poll(id){if(!id){showError('任务异常',new Error('缺少 task_id'));finishButtons();return}currentTask=id;const tick=async()=>{try{const r=await fetch(api+'/ai_ops/'+encodeURIComponent(id)),j=await r.json();if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));const events=j.events||[];out.innerHTML='<div class="timeline"><span class="pill">task '+esc(id.slice(0,8))+'</span><span class="pill">'+esc(j.status)+'</span></div>'+events.map(e=>'<div class="event"><b>'+esc(e.type)+'</b><pre>'+esc(JSON.stringify(e.payload,null,2))+'</pre></div>').join('')+(j.status==='waiting_approval'?approvalHtml(events):'')+(j.report?renderReport(j.report):'');if(['completed','failed','cancelled','timed_out','waiting_approval'].includes(j.status)){finishButtons();return}setTimeout(tick,500)}catch(error){showError('轮询失败',error);finishButtons()}};tick()}
function showError(title,error){out.innerHTML='<div class="report"><h3>'+esc(title)+'</h3><p>'+esc(error.message)+'</p></div>'}
async function askQuestion(){const box=byId('chatbox');box.textContent='查询中…';try{const r=await fetch(api+'/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:byId('question').value,session_id:chatSession,service_name:byId('service').value,environment:byId('env').value,enable_tools:true})}),j=await r.json();if(!r.ok)throw new Error(j.detail?JSON.stringify(j.detail):('HTTP '+r.status));chatSession=j.session_id;box.innerHTML='<p>'+esc(j.answer).replace(/\n/g,'<br>')+'</p><small>会话 '+esc(chatSession.slice(0,8))+' · Agent工具：'+(j.tool_calls||[]).map(x=>esc(x.tool_name)).join(', ')+'</small>'+(j.sources||[]).slice(0,3).map(x=>'<div class="source">'+esc(x.title)+' · '+esc(x.retrieval_strategy)+'<br><small>检索查询：'+esc((x.knowledge_queries||[]).join(' / '))+'</small><br>'+esc(x.content).slice(0,180)+'</div>').join('')}catch(error){box.innerHTML='<p>查询失败：'+esc(error.message)+'</p>'}}
async function loadTasks(){try{const j=await (await fetch(api+'/ai_ops')).json();byId('tasks').innerHTML=(j.tasks||[]).slice(0,15).map(t=>'<div class="row"><div class="grow"><b>'+esc(t.alert?.service_name)+' / '+esc(t.alert?.alert_name)+'</b><br><small>'+esc(t.status)+' · '+esc(t.task_id.slice(0,8))+'</small></div><button class="secondary small" onclick="poll(\''+esc(t.task_id)+'\')">查看</button></div>').join('')||'暂无任务'}catch{byId('tasks').textContent='加载失败'}}
async function loadDocs(){try{const j=await (await fetch(api+'/documents')).json();byId('documents').innerHTML=(j.documents||[]).map(d=>'<div class="row"><div class="grow"><b>'+esc(d.filename)+'</b><br><small>'+esc(d.service_name)+' · '+esc(d.document_type)+' · '+d.chunk_count+' chunks</small></div></div>').join('')||'<small>暂无文档</small>'}catch{byId('documents').textContent='加载失败'}}
async function uploadDoc(){const file=byId('file').files[0],msg=byId('uploadMsg');if(!file){msg.textContent='请先选择文件';return}const form=new FormData();form.append('file',file);form.append('service_name',byId('service').value);form.append('environment',byId('env').value);form.append('document_type',byId('docType').value);msg.textContent='解析、Embedding 和索引中…';try{const r=await fetch(api+'/upload_file',{method:'POST',body:form}),j=await r.json();if(!r.ok)throw new Error(j.detail||'上传失败');msg.textContent=j.message;loadDocs()}catch(error){msg.textContent=error.message}}
function metric(value){return value==null?'—':(Number(value)*100).toFixed(1)+'%'}
async function loadEval(){try{const j=await (await fetch(api+'/evaluations/latest')).json(),rag=j.rag,agent=j.agent,rg=j.ragas,pr=j.public_rag,pc=j.public_rca,rb=j.robustness;byId('evaluations').innerHTML='<div class="two"><div class="source"><b>检索评测</b><br>样本 '+esc(rag?.case_count)+' · Hybrid Recall@3 '+metric(rag?.hybrid_rrf?.['recall@3'])+' · MRR '+metric(rag?.hybrid_rrf?.mrr)+'</div><div class="source"><b>Agent 评测</b><br>场景 '+esc(agent?.scenario_count)+' · 成功率 '+metric(agent?.scenario_success_rate)+' · 越权率 '+metric(agent?.high_risk_unauthorized_execution_rate)+'</div></div><div class="two"><div class="source"><b>中文公开 RAG（三轮）</b><br>查询 '+esc(pr?.case_count)+' · Recall@3 '+metric(pr?.repeat_statistics?.hybrid_rrf?.['recall@3']?.mean)+' ± '+metric(pr?.repeat_statistics?.hybrid_rrf?.['recall@3']?.std)+' · MRR '+metric(pr?.repeat_statistics?.hybrid_rrf?.mrr?.mean)+'</div><div class="source"><b>RootCauseBench（三轮）</b><br>场景 '+esc(pc?.case_count)+' · 首故障服务 '+metric(pc?.repeat_statistics?.first_failing_service_accuracy?.mean)+' ± '+metric(pc?.repeat_statistics?.first_failing_service_accuracy?.std)+' · 处置 '+metric(pc?.repeat_statistics?.remediation_accuracy?.mean)+'</div></div><div class="source"><b>鲁棒性（三轮）</b><br>无答案 / 证据冲突 / 工具失败 / 恶意 Prompt · 通过率 '+metric(rb?.pass_rate_mean)+' ± '+metric(rb?.pass_rate_std)+'</div>'+(rg?'<div class="source"><b>RAGAS 生成质量</b><br>'+esc(JSON.stringify(rg.summary||{}))+'</div>':'<small>RAGAS 结果将在运行评测后显示。</small>')}catch{byId('evaluations').textContent='评测结果加载失败'}}
ready();loadTasks();loadDocs();loadEval();
</script></body></html>
