[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2root-agent"
version = "0.1.0"
description = "Evidence-driven incident diagnosis agent with FastAPI, LangGraph, MCP, SQLite, and Milvus Lite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "langgraph>=0.6,<0.7",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "pymilvus[milvus-lite]>=2.5,<3",
  "pypdf>=5,<7",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3,<6"]
evaluation = [
  "ragas==0.4.3",
  "openai>=1.104,<3",
  "langchain>=0.3.27,<0.4",
  "langchain-community>=0.3.31,<0.4",
  "langchain-openai>=0.3.35,<0.4",
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "asgi-lifespan>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
